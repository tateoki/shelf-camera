<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>背表紙を撮る｜タテオキ</title>
<!--
  背表紙の撮影ページ（●写真から書籍特定機能・試作 v1）
  ・中央の縦長の枠（外側は暗く）に背表紙を収めて撮る
  ・角度：スマホの前後の傾き（上から見下ろす／下から見上げる）が ±TILT_MAX 度を超えたら撮れない。左右の傾きは表示だけ
  ・ぼやけ：枠の中のくっきり具合・揺れ（ジャイロ）・暗さを撮る前に確かめる。撮った後にもう一度確かめる
  ・案内・ボタンは左右の暗い所（撮らない部分）に置く
  ・スマホのカメラの機能（できる機種だけ）：オートフォーカス・自動露出・自動ホワイトバランス・タップでピント固定・ズーム（1×・1.5×・2×）
  ・送る前の写真はブラウザの保存領域（IndexedDB）に置く。ページを閉じても消えず、次に開いたら続きを送る
  ・送り先：GAS の Web アプリ（Google ドライブの「背表紙_取り込み」/棚の名前/ に、写真 .jpg と枠などの情報 .json を保存）
  URL：施設は index.html?c=撮影コード（配下の棚を選んで撮る）。管理者は index.html（合言葉は最初に一度入れるとスマホが覚える。?key= を付けて開いても覚えて URL から消す）・?shelf=フォルダ名（入れ子は /）
-->
<style>
  :root { --ok: #2fbf71; --ng: #e5484d; --bg: #000; --fg: #fff; --sub: #bbb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; overflow: hidden; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 16px; padding: 24px; text-align: center; overflow-y: auto; }
  #start select { font: inherit; font-size: 20px; font-weight: 700; padding: 10px 12px; width: 100%; border-radius: 8px; border: 1px solid #555; background: #111; color: var(--fg); }
  #permNote { font-size: 12px !important; text-align: left; max-width: 340px; }
  #isbnDone { position: fixed; inset: 0; z-index: 7; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 24px; font-weight: 800; text-align: center; pointer-events: none; }
  #isbnDone small { font-size: 16px; font-weight: 700; color: var(--ok); }
  #permNow { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 14px); z-index: 20; margin: 0 auto; display: none; font-size: 15px; font-weight: 700; color: #000; background: #ffd60a; padding: 10px 14px; border-radius: 10px; max-width: 340px; line-height: 1.6; text-align: left; }
  #start h1 { font-size: 20px; margin: 0; }
  #start p { color: var(--sub); font-size: 14px; line-height: 1.7; margin: 0; }
  #start input { font: inherit; font-size: 16px; padding: 10px 12px; width: 100%; max-width: 320px; border-radius: 8px; border: 1px solid #555; background: #111; color: var(--fg); }
  button { font: inherit; border: 0; border-radius: 999px; padding: 12px 22px; font-size: 16px; background: #fff; color: #000; }
  button:disabled { opacity: .35; }
  #cam { position: fixed; inset: 0; display: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  /* ピントを合わせた所の印（固定している間は残す） */
  #afBox { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 2px solid #ffd60a; border-radius: 4px; pointer-events: none; display: none; }
  #afBox span { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 700; color: #000; background: #ffd60a; padding: 1px 6px; border-radius: 4px; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #frame { position: absolute; border: 3px solid var(--ng); border-radius: 6px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .58); pointer-events: none; transition: border-color .15s; }
  #frame.ok { border-color: var(--ok); }
  /* 上下の合わせ線：本の上の端と下の端をこの点線に合わせてもらう（左右は枠からはみ出してもよい。写真は画面全体を保存する） */
  .hline { position: absolute; left: -14px; right: -14px; height: 0; border-top: 3px dashed #ffd60a; pointer-events: none; filter: drop-shadow(0 0 2px rgba(0, 0, 0, .7)); }
  .hline span { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 13px; font-weight: 700; color: #000; background: #ffd60a; padding: 1px 8px; border-radius: 4px; }
  #hTop { top: 8%; } #hTop span { bottom: 4px; }
  #hBot { top: 92%; } #hBot span { top: 4px; }
  /* 左右の暗い所（撮らない部分）：左＝棚・案内・確認・送った枚数、右＝シャッター・水平器・標準のカメラ */
  #sideL, #sideR { position: absolute; top: var(--bar, 64px); bottom: 0; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 12px) 8px calc(env(safe-area-inset-bottom) + 12px); }
  #sideL { left: 0; top: 70px; gap: 12px; font-size: 13px; }   /* 左の確認の位置も、上のボタンの数で動かさない */
  #sideR { right: 0; top: 0 !important; align-items: center; justify-content: center; }   /* シャッター・ズームは画面の上下の中央（上のボタンの数で動かさない） */
  #shutterWrap { position: relative; display: flex; flex-direction: column; align-items: center; }
  /* 上のバー（左右いっぱい）：棚の名前（足りなければ2行）と、右上に［棚を変える］。撮影の枠の位置は変えない（バーは暗い所に重ねる） */
  #topBar { position: absolute; z-index: 3; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 8px) 12px 6px; }
  #topBar #shelfName { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 0 4px rgba(0, 0, 0, .8); align-self: flex-start; padding-top: 6px; }   /* 棚の名前は上にそろえる（ボタンが2段でも1行目に出す） */
  #topBtns { flex: none; display: flex; flex-direction: column; align-items: stretch; gap: 6px; }   /* 右上：［撮影を終わる］の下に［棚を変える］（2つは同じ幅） */
  #shelfIsbn { display: none; margin-top: 4px; font-size: 14px; font-weight: 700; color: var(--ok); text-shadow: 0 0 4px rgba(0, 0, 0, .8); }
  #shelfName { color: #fff; font-size: 17px; font-weight: 700; word-break: break-all; }
  #guide { font-weight: 700; font-size: 15px; line-height: 1.5; color: #ffd60a; }   /* 4つの確認の下に、直し方（黄色）。そろったら緑で「撮影できます」 */
  #guide.ok { color: var(--ok); }
  #level { position: absolute; right: 6px; top: 50%; width: 10px; height: 140px; margin-top: -70px; border-radius: 5px; background: rgba(255, 255, 255, .25); }
  #levelZone { position: absolute; left: 0; right: 0; background: rgba(47, 191, 113, .5); }
  #levelDot { position: absolute; left: -4px; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; background: var(--ng); border: 2px solid #fff; }
  #levelDot.ok { background: var(--ok); }
  #checks { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; font-size: 17px; font-weight: 700; margin-top: 48px; }
  #checks span { padding: 8px 18px; border-radius: 999px; background: rgba(229, 72, 77, .9); }
  #checks span.ok { background: rgba(47, 191, 113, .85); }
  /* 「?」：その機種ではセンサーで確かめられない項目（止めずに通す） */
  #shutter { width: 74px; height: 74px; padding: 0; border-radius: 50%; background: #fff; border: 5px solid rgba(255, 255, 255, .4); background-clip: padding-box; }
  #shutter.off { opacity: .35; }
  /* ズーム（できる機種だけ出す）：シャッターの下 */
  #camTools { position: absolute; top: calc(100% + 16px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }   /* ズーム：縦に並べる */
  #camTools button { font-size: 13px; padding: 8px 0; width: 50px; border-radius: 999px; background: rgba(255, 255, 255, .18); color: #fff; }
  #camTools button.on { background: #fff; color: #000; font-weight: 700; }
  #zoomNow { font-size: 11px; color: var(--sub); }
  @keyframes blink { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); box-shadow: 0 0 0 3px #fff; } }
  #checks span.blink { animation: blink .35s 3; }
  #sent { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  #sentN { font-size: 17px; font-weight: 700; }
  #sending { display: none; font-size: 20px; font-weight: 800; color: #000; background: #ffd60a; padding: 8px 12px; border-radius: 10px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
  #fallback { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 12px); font-size: 11px; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .15); color: #fff; line-height: 1.4; }
  #review { position: fixed; inset: 0; display: none; background: #000; flex-direction: column; }
  #review img { flex: 1; min-height: 0; object-fit: contain; width: 100%; }
  #reviewMsg { padding: 10px 16px; text-align: center; font-size: 15px; }
  #reviewMsg.ng { color: #ff9ea1; }
  #reviewBtns { display: flex; gap: 12px; justify-content: center; padding: 8px 16px calc(env(safe-area-inset-bottom) + 18px); }
  #reviewBtns .sub { background: rgba(255, 255, 255, .15); color: #fff; }
  #toast { white-space: pre-line; position: fixed; left: 50%; top: 40%; transform: translateX(-50%); background: rgba(0, 0, 0, .8); padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; z-index: 9; max-width: 86%; text-align: center; }
  canvas { display: none; }
  .kidList { display: flex; flex-direction: column; gap: 8px; }
  .kidList button { background: rgba(255, 255, 255, .15); color: #fff; border-radius: 10px; text-align: left; padding: 12px 14px; }
  .kidList button.on { background: #fff; color: #000; font-weight: 700; }
  /* 操作のボタン（棚を変える・撮影を終わる）：状態の表示（緑・赤）と見分けられるよう、白地に黒の文字 */
  #btnKid { display: none; white-space: nowrap; text-align: center; font-size: 15px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: #fff; color: #000; line-height: 1.35; box-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
  #kidPop { position: fixed; inset: 0; z-index: 8; display: none; background: rgba(0, 0, 0, .88); align-items: center; justify-content: center; padding: 24px; }
  #kidPop > div { background: #1c1c1e; border-radius: 14px; padding: 18px; width: 100%; max-width: 340px; max-height: 80vh; overflow: auto; }
  /* 送信中の帯（画面の上） */
  #sendBanner { position: fixed; left: 8px; right: 8px; top: calc(var(--bar, 64px) + 2px); z-index: 5; display: none; background: #ffd60a; color: #000; border-radius: 10px; padding: 6px 10px; text-align: center; font-size: 12px; line-height: 1.45; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); pointer-events: none; }
  body.sending #sideL { margin-top: 84px; }   /* 帯の下にずらす */
  #sendBanner b { font-size: 16px; }
  /* 撮影を終わる */
  #btnEnd { white-space: nowrap; text-align: center; font-size: 15px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: #fff; color: #000; line-height: 1.35; box-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
  #endBox { position: fixed; inset: 0; z-index: 8; display: none; background: rgba(0, 0, 0, .88); align-items: center; justify-content: center; padding: 24px; }
  #endIn { background: #1c1c1e; border-radius: 14px; padding: 22px 18px; max-width: 340px; width: 100%; text-align: center; }
  #endMsg { font-size: 17px; font-weight: 700; line-height: 1.6; margin-bottom: 6px; }
  #endSub { font-size: 13px; color: var(--sub); line-height: 1.6; margin-bottom: 16px; }
  #endBtns { display: flex; flex-direction: column; gap: 10px; }
  #endBtns .sub { background: rgba(255, 255, 255, .15); color: #fff; }
  /* ISBN のバーコードを読む（［▥ ISBN］）：写真は撮らず、横長の枠の中のバーコードを読み続ける */
  /* 切り替え（［棚を変える］の下）：背表紙／ISBN・利用者モード／管理者モード（管理者だけ） */
  #modeBtns, #flowBtns { display: flex; gap: 4px; }
  #flowBtns, #seqBtns { display: none; gap: 4px; }
  #seqBtns button { flex: 1; font-size: 12px; font-weight: 700; padding: 6px 6px; white-space: nowrap; background: rgba(60, 60, 60, .85); color: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
  #seqBtns button.on { background: #ffd60a; color: #000; }
  /* 在庫あり（書籍ごと）：撮影する・しないを選ぶ */
  #stockBox { position: fixed; inset: 0; z-index: 8; display: none; background: rgba(0, 0, 0, .8); align-items: center; justify-content: center; padding: 20px; }
  #stockBox > div { background: #1c1c1e; border-radius: 14px; padding: 18px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
  #stockT { font-size: 20px; font-weight: 800; color: #ffd60a; }
  #stockI { font-size: 15px; font-weight: 700; }
  #stockF { font-size: 14px; line-height: 1.6; word-break: break-all; color: #ddd; }
  #stockBox .b { display: flex; gap: 10px; margin-top: 6px; } #stockBox .b button { flex: 1; font-weight: 700; }
  #stockBox .b .sub { background: rgba(255, 255, 255, .15); color: #fff; }
  #haveInfo { font-size: 12px; color: var(--sub); line-height: 1.4; }
  #modeBtns button, #flowBtns button { flex: 1; font-size: 13px; font-weight: 700; padding: 7px 6px; white-space: nowrap; background: rgba(60, 60, 60, .85); color: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
  #modeBtns button.on, #flowBtns button.on { background: #fff; color: #000; }
  /* 角度が ±EXCEL 度以内：シャッターのすぐ上に1行 */
  #excel { display: none; white-space: nowrap; font-size: 12px; font-weight: 900; color: #000; padding: 2px 10px !important; margin-bottom: -6px; border-radius: 999px;
    background: linear-gradient(90deg, #ffe600, #ff9f0a) !important; box-shadow: 0 0 8px rgba(255, 200, 0, .9); }
  /* ISBN が読めない本：背表紙の撮影へ */
  #btnNoIsbn { background: #ffd60a !important; color: #000 !important; }
  /* スマホを横に持ったとき（画面も横）：枠は横長（寝かせた本の背表紙）。本の上を左の線、下を右の線に合わせる。写真は縦に回して送る */
  body.land #topBtns { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; max-width: 72%; }
  body.land #topBtns > button, body.land #modeBtns button, body.land #flowBtns button { font-size: 13px; padding: 6px 10px; }
  body.land .hline { left: auto; right: auto; top: -14px; bottom: -14px; height: auto; width: 0; border-top: 0; border-left: 3px dashed #ffd60a; }
  body.land #hTop { left: 5%; top: -14px; } body.land #hBot { left: 95%; top: -14px; }
  body.land #hTop span, body.land #hBot span { top: auto; bottom: calc(100% + 2px); left: 0; transform: translateX(-50%); }
  body.land #checks { margin-top: 4px; gap: 6px; font-size: 15px; }
  body.land #checks span { padding: 5px 12px; }
  body.land #guide { font-size: 13px; }
  body.land #camTools { flex-direction: row; gap: 4px; top: calc(100% + 8px); }
  body.land #camTools button { width: 34px; font-size: 11px; padding: 7px 0; }
  body.land.isbn #sideL { top: 60px !important; }
  #isbnBox { position: absolute; display: none; border: 3px solid #ffd60a; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .58); pointer-events: none; transition: border-color .15s; }
  #isbnBox.ok { border-color: var(--ok); } #isbnBox.ng { border-color: var(--ng); }
  #isbnBox span { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); text-align: center; font-size: 13px; font-weight: 700; line-height: 1.4; color: #000; background: #ffd60a; padding: 3px 8px; border-radius: 4px; }
  /* 枠の下に、同じ大きさのボタンを2つ（1行に収める） */
  #isbnBtns { position: absolute; display: none; flex-direction: column; gap: 8px; }
  #isbnBtns button { width: 100%; white-space: nowrap; font-size: 13px; font-weight: 700; padding: 11px 6px; border-radius: 12px; background: #fff; color: #000; }
  body.isbn #isbnBtns { display: flex; }
  #isbnPanel { display: none; flex-direction: column; gap: 8px; margin-top: auto; }
  #isbnCount { font-size: 16px; font-weight: 700; line-height: 1.4; }
  #isbnMsg { font-size: 13px; font-weight: 700; line-height: 1.45; color: #ffd60a; word-break: break-all; }
  #isbnMsg.ok { color: var(--ok); } #isbnMsg.ng { color: #ff9ea1; }
  #isbnPanel button { font-size: 13px; font-weight: 700; padding: 8px 10px; border-radius: 12px; line-height: 1.3; background: #fff; color: #000; }
  body.isbn #frame, body.isbn #checks, body.isbn #guide, body.isbn #shutterWrap, body.isbn #fallback, body.isbn #level, body.isbn #afBox, body.isbn #excel { display: none !important; }
  body.land.isbn #isbnPanel { margin-top: auto; }
  body.isbn #isbnBox { display: block; } body.isbn #isbnPanel { display: flex; } body.isbn #sent { margin-top: auto; }
  body.isbn #sideL { top: var(--boxb, 50%) !important; padding-top: 10px; }   /* ISBN の枠の下から */
  body.isbn #isbnPanel { margin-top: 0; }
  #debug { font-size: 10px; color: #999; display: none; word-break: break-all; }
</style>
</head>
<body>
<div id="start">
  <h1>撮影して本を追加する</h1>
  <div id="kidBox" style="display:none;width:100%;max-width:340px">
    <div id="kidTitle" style="font-size:22px;font-weight:700;margin-bottom:8px;word-break:break-all;text-align:left"></div>
    <div id="kidList" class="kidList" style="text-align:left"></div>
    <div style="font-size:22px;font-weight:700;margin-top:8px;text-align:left">に追加します</div>
    <div id="userBox" style="margin-top:16px;display:flex;flex-direction:column;gap:6px;text-align:left">
      <label for="userName" style="font-size:13px;color:var(--sub)">追加者のお名前（必須）</label>
      <input id="userName" autocomplete="name" placeholder="例：山田 太郎">
      <label for="userOrg" style="font-size:13px;color:var(--sub)">追加者の所属（もしくは部署）</label>
      <input id="userOrg" autocomplete="organization" placeholder="例：〇〇株式会社 営業部">
      <div style="font-size:12px;color:var(--sub);line-height:1.5">お名前・所属は一度入力するとスマホが覚えるので、次からは入力不要です。</div>
    </div>
  </div>
  <div id="shelfBox" style="display:none;width:100%;flex-direction:column;align-items:center;gap:6px">
    <label for="keyIn" id="keyLbl" style="font-size:13px;color:var(--sub)">管理者の合言葉（このスマホが覚えます）</label>
    <input id="keyIn" type="password" autocomplete="off" placeholder="合言葉">
    <label for="shelfIn" style="font-size:13px;color:var(--sub)">棚（フォルダ）の名前（入れ子は / で区切る。空なら振り分け待ち）</label>
    <input id="shelfIn" placeholder="例：kernel-hongo__kernel本郷">
  </div>
  <button id="btnStart">カメラを開始</button>
  <div id="permNow"></div>
  <p id="startErr" style="color:#ff9ea1"></p>
  <p id="startLeft" style="display:none;color:#000;background:#ffd60a;padding:10px 14px;border-radius:10px;font-weight:700"></p>
</div>

<div id="cam">
  <video id="video" playsinline muted autoplay></video>
  <div id="frame"><div class="hline" id="hTop"><span>本の上辺</span></div><div class="hline" id="hBot"><span>本の下辺</span></div></div>
  <div id="isbnBox"><span>本の裏のバーコード（２つある場合は上段の「978」で始まる方）を読み込んでください</span></div>
  <div id="isbnBtns"><button id="btnIsbnType">ISBNを文字入力する</button><button id="btnNoIsbn">ISBNが読めない場合はこちらをタップしてください</button></div>
  <div id="topBar"><div id="shelfWrap" style="flex:1;min-width:0;align-self:flex-start"><div id="shelfName"></div><div id="shelfIsbn"></div></div><div id="topBtns"><button id="btnEnd">撮影を終わる</button><button id="btnKid">棚を変える</button><div id="flowBtns"><button id="btnFlowUser" title="利用者モード">利用者</button><button id="btnFlowAdmin" title="管理者モード">管理者</button></div><div id="modeBtns"><button id="btnModeIsbn">▥ ISBN</button><button id="btnModeSpine" class="on">📷 背表紙</button></div><div id="seqBtns"><button id="btnSeqSeq">ISBN連続</button><button id="btnSeqBook">書籍ごと</button></div></div></div>
  <div id="sideL">

<script>
'use strict';
// ---------------- 設定 ----------------
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbwjLMBAuYXmrCRprISEhkbh5Pdf1ccbeGh-RJh7o6_4QxjTNId9usnozvGE0NEDiCAwag/exec',            // GAS の Web アプリの URL（https://script.google.com/macros/s/…/exec）。空なら URL の ?gas= を使う
  FRAME_W: 1 / 3,         // 枠の幅（画面の幅に対する割合）
  FRAME_H: 0.85,          // 枠の高さ（画面の高さに対する割合。案内・ボタンは左右の暗い所に置く）
  TILT_MAX: 5,            // 前後の傾きの許す範囲（度）。この範囲で ○（撮れる）
  EXCEL: 2,               // この範囲なら ◎ とシャッターの上に「エクセレント！」
  SHARP_MIN: 12,          // くっきり具合の下限（いちばんくっきりした縦の帯のエッジの強さ。真っ黒・真っ白・大きなぼけを止める。実機で調整する）
  SHARP_PEAK_SEC: 3,      // 直近この秒数のいちばん良いくっきり具合を覚える
  SHARP_PEAK_RATIO: 0.8,  // その何割以上なら ○（細い背表紙・地味な背表紙でも、ピントが合った時点で ○ になるように）
  SHARP_AFTER_RATIO: 0.6, // 撮った後：撮る前の値のこの割合より下ならぼやけとみなす
  ROT_MAX: 25,            // 揺れの上限（スマホの回る速さ・度/秒。ジャイロで測る。手で持って止めた状態で通る値）
  LIGHT_MIN: 45,          // 明るさの下限（0〜255）
  JPEG_Q: 0.9,            // 画質 90
  // ズームのボタン（表示と実際の倍率）。2倍以上はデジタルズームで画質が落ちる機種があるので、「2×」は実際は 1.9 倍
  ZOOMS: [{ v: 1, label: '1×' }, { v: 1.25, label: '1.25×' }, { v: 1.5, label: '1.5×' }, { v: 1.75, label: '1.75×' }, { v: 1.9, label: '2×' }],
  USER_ZOOM: 1.25,        // 利用者モードの最初のズーム（近づきすぎてピントが合わないのを防ぐ。選び直したら、それを使う）
  ZOOM_MAX: 1.9,          // ピンチでもここまで
};
const P = new URLSearchParams(location.search);
const GAS_URL = CONFIG.GAS_URL || P.get('gas') || '';
// 撮影コード（施設の QR）と管理者の合言葉。合言葉は URL に付いていたら覚えて、URL からは消す（人に見られないように）
const CODE = (P.get('c') || '').trim();
let KEY = '';
try { KEY = P.get('key') || localStorage.getItem('sc_key') || ''; if (P.get('key')) localStorage.setItem('sc_key', P.get('key')); } catch (e) { KEY = P.get('key') || ''; }
if (P.has('key')) { P.delete('key'); try { history.replaceState(null, '', location.pathname + (P.toString() ? '?' + P.toString() : '')); } catch (e) {} }
// 管理者用の撮影 QR（カテゴリ管理の［📷 撮影 QR］で切り替えて出す。URL に a=1）：最初から管理者として開き、写真は QR のカテゴリの本棚に入れる
//   利用者用の QR には、管理者の入口・表示を一切出さない
const QA = !!CODE && P.get('a') === '1';
const ADMIN = !CODE || QA;
// 端末ID：この端末（ブラウザ）だけの番号。最初に1回作って覚える（送った人の記録・止めるときに使う）
let DEV = '';
try { DEV = localStorage.getItem('sc_dev') || ''; } catch (e) {}
if (!DEV) { DEV = Array.from(crypto.getRandomValues(new Uint8Array(10)), b => b.toString(36).padStart(2, '0')).join('').slice(0, 16); try { localStorage.setItem('sc_dev', DEV); } catch (e) {} }
const USER = { name: '', org: '' };
try { USER.name = localStorage.getItem('sc_user_name') || ''; USER.org = localStorage.getItem('sc_user_org') || ''; } catch (e) {}
const DEBUG = P.has('debug');
const $ = id => document.getElementById(id);

let shelf = P.get('shelf') || '';
const KID = { root: '', list: [], sel: null, left: null };   // 施設：いちばん上の棚の名前・配下の棚・選んだ棚
if (ADMIN) {
  $('shelfBox').style.display = 'flex';
  if (KEY) { $('keyIn').style.display = 'none'; $('keyLbl').style.display = 'none'; }
  if (QA) {   // 管理者用の QR：本棚は QR のカテゴリから選ぶ（棚の名前の欄・お名前の欄は出さない）
    $('shelfIn').style.display = 'none'; document.querySelector('label[for="shelfIn"]').style.display = 'none';
    if (KEY) $('shelfBox').style.display = 'none';
    loadKids(); $('userBox').style.display = 'none';
  }
  else if (shelf) $('shelfIn').value = shelf;
  else { try { $('shelfIn').value = localStorage.getItem('sc_shelf') || ''; } catch (e) {} }
} else { loadKids(); $('userName').value = USER.name; $('userOrg').value = USER.org; }
// 最初の画面：棚が2つ以上ならドロップダウン（「親 ＞ 子」は「親 - 子」で出す）
function kidName(l) { return String(l || '').replace(/\s*＞\s*/g, ' - '); }
function esc(t) { return String(t).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c])); }
function kidId() { return KID.sel ? (KID.sel.root ? '' : KID.sel.id) : ''; }   // 受け口へ：カテゴリそのものは空
// ドロップダウンの文字：いちばん上のカテゴリ名を除いた「子 - 孫」。カテゴリそのものは「（○○ そのもの）」
function kidOpt(k) {
  if (k.root || k.label === KID.root) return `（${KID.root} そのもの）`;
  const pre = KID.root + ' ＞ ';
  return kidName(k.label.startsWith(pre) ? k.label.slice(pre.length) : k.label);
}
function kidStartHtml() {
  if (KID.list.length === 1) return `<div style="font-size:22px;font-weight:700;word-break:break-all">${esc(kidName(KID.list[0].label))}</div>`;
  return `<select id="kidSel"><option value="">（本棚を選んでください）</option>` +
    KID.list.map(k => `<option value="${esc(k.id)}"${KID.sel && KID.sel.id === k.id ? ' selected' : ''}>${esc(kidOpt(k))}</option>`).join('') + `</select>`;
}
function kidTitleSet() {   // 親カテゴリ名 の（棚が1つだけで、カテゴリそのものに入れるときは、下に名前を大きく出すので出さない）
  const one = KID.list.length === 1 && KID.list[0].label === KID.root;
  $('kidTitle').textContent = KID.root && !one ? KID.root + ' の' : '';
}
document.addEventListener('change', e => { if (e.target.id === 'kidSel' && e.target.value) kidPick(e.target.value); });
function kidHtml() { return KID.list.map(k => `<button data-kid="${k.id}" class="${KID.sel && KID.sel.id === k.id ? 'on' : ''}">${k.label.replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]))}</button>`).join(''); }
function kidPick(id) {
  KID.sel = KID.list.find(k => k.id === id) || null;
  try { localStorage.setItem('sc_kid_' + CODE, id); } catch (e) {}
  $('kidList').innerHTML = kidStartHtml(); $('kidList2').innerHTML = kidHtml();
  $('kidPop').style.display = 'none'; shelfLabel(); if ($('cam').style.display === 'block') layout();
}
// 受け口に JSONP で聞く（スクリプトとして読み込む。iPhone の Safari が fetch を止めても読める）
function jsonp(url, ms = 25000) {
  return new Promise((ok, ng) => {
    const cb = '__sc_cb' + Date.now().toString(36) + Math.floor(Math.random() * 1e6), el = document.createElement('script');
    const done = () => { delete window[cb]; el.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); ng(new Error('時間内に答えがありませんでした')); }, ms);
    window[cb] = j => { done(); ok(j); };
    el.onerror = () => { done(); ng(new Error('受け口に問い合わせできませんでした')); };
    el.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(el);
  });
}
// 施設の棚：待たせないように
//   ・QR の n（棚の名前）はすぐ表示する。d=1（配下の棚がない）なら、そのカテゴリ自体に入れるので読み込まない
//   ・前回読んだ棚の一覧（スマホが覚えている）をすぐ出し、裏で最新の一覧を読み直す
//   ・読み込み中でも［カメラを開始］を押せる（棚を選ぶまでは撮れない。一覧が届いたら選ぶ画面を出す）
function kidApply(name, list) {
  KID.root = name || KID.root; KID.list = list || [];
    // 配下の本棚があるときは、配下の本棚だけを出す（親の本棚そのものは出さない）。並びは受け口が返す順（カテゴリ管理の並び順）
  if (KID.list.length && !(KID.list.length === 1 && KID.list[0].label === KID.root))
    KID.list = KID.list.map(k => ({ id: k.id, label: k.label.startsWith(KID.root + ' ＞ ') ? k.label : KID.root + ' ＞ ' + k.label }));
  kidTitleSet();
  if (!KID.list.length) { $('kidList').innerHTML = '<div style="color:#ff9ea1">写真を入れられる棚がまだありません</div>'; KID.sel = null; return; }
  let last = KID.sel ? KID.sel.id : ''; if (!last) { try { last = localStorage.getItem('sc_kid_' + CODE) || ''; } catch (e) {} }
  KID.sel = KID.list.find(k => k.id === last) || (KID.list.length === 1 ? KID.list[0] : null);
  $('kidList').innerHTML = kidStartHtml();
  $('kidList2').innerHTML = kidHtml();
  if ($('cam').style.display === 'block') { shelfLabel(); layout(); if (!KID.sel && KID.list.length > 1) { $('btnKid').style.display = 'inline-block'; $('kidPop').style.display = 'flex'; } }
  if (KID.list.length > 1 && $('cam').style.display === 'block') $('btnKid').style.display = 'inline-block';
}
async function loadKids() {
  $('kidBox').style.display = 'block';
  const name = (P.get('n') || '').trim();
  if (P.get('d') === '1' && name) kidApply(name, [{ id: '', label: name }]);   // QR を作ったときは配下の棚がなかった：すぐ出す（あとで棚が増えていることがあるので、裏で読み直す）
  let cached = null; try { cached = JSON.parse(localStorage.getItem('sc_kids_' + CODE) || 'null'); } catch (e) {}
  if (cached && cached.list) kidApply(name || cached.name, cached.list);
  else if (P.get('d') === '1' && name) {}
  else { KID.root = name; $('kidTitle').textContent = name ? name + ' の' : ''; $('kidList').innerHTML = '<div style="font-size:13px;color:var(--sub)">棚を読み込んでいます…（先にカメラを開始しても大丈夫です）</div>'; }
  try {
    const j = await jsonp(GAS_URL + '?code=' + encodeURIComponent(CODE) + '&dev=' + encodeURIComponent(DEV) + '&name=' + encodeURIComponent(USER.name));   // 受け口へは code（c は Apps Script が使う名前のため使えない）
    if (!j.ok) throw new Error(j.error || '読み込めませんでした');
    KID.left = j.left;
    try { localStorage.setItem('sc_kids_' + CODE, JSON.stringify({ name: j.name, list: j.kids || [] })); } catch (e) {}
    kidApply(j.name, j.kids || []);
  } catch (e) { if (!cached) { $('kidList').innerHTML = ''; $('startErr').textContent = 'この QR コードの棚を読み込めませんでした（' + e.message + '）'; } }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-kid]'); if (b) kidPick(b.dataset.kid); });
function shelfLabel() {
  $('shelfName').textContent = ADMIN && !CODE ? (shelf ? '棚：' + shelf : '棚：振り分け待ち（あとで選びます）') : '棚：' + (KID.sel ? KID.sel.label : KID.root);
}

const S = { ending: null, beta: null, gamma: null, rot: null, tiltOk: false, sharp: 0, move: 0, light: 0, prev: null, okSince: 0, sent: 0, queue: [], busy: false, shot: null, orientWarn: false };

function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms); }

// ---------------- 開始（iPhone は、角度のセンサーの許可をボタンを押したときに求める決まり） ----------------
//   許可の画面（iPhone の標準の画面）の文言は変えられないため、聞く前の説明と、聞いている間の理由を、このページに出す
const NEED_MOTION = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
function permNow(t) { const el = $('permNow'); el.textContent = t; el.style.whiteSpace = 'pre-line'; el.style.display = t ? 'block' : 'none'; }
$('btnStart').onclick = async () => {
  $('startErr').textContent = '';
  if (!GAS_URL) { $('startErr').textContent = '送り先（GAS の URL）が設定されていません'; return; }
  if (ADMIN) {
    if (!KEY) { KEY = $('keyIn').value.trim(); if (!KEY) { $('startErr').textContent = '合言葉を入れてください（施設の方は、棚の QR コードから開いてください）'; return; } try { localStorage.setItem('sc_key', KEY); } catch (e) {} }
    if (QA) { if (!KID.sel && KID.list.length > 1) { $('startErr').textContent = '追加する本棚を選んでください'; return; } }
    else {
      shelf = $('shelfIn').value.trim().replace(/\s*\/\s*/g, '/');
      try { localStorage.setItem('sc_shelf', shelf); } catch (e) {}
    }
  } else {
    if (!KID.sel && KID.list.length > 1) { $('startErr').textContent = '追加する本棚を選んでください'; return; }
    USER.name = $('userName').value.trim().slice(0, 40); USER.org = $('userOrg').value.trim().slice(0, 60);
    if (!USER.name) { $('startErr').textContent = '追加者のお名前を入れてください'; $('userName').focus(); return; }
    try { localStorage.setItem('sc_user_name', USER.name); localStorage.setItem('sc_user_org', USER.org); } catch (e) {}
  }
  try {
    if (NEED_MOTION) {
      permNow('（1/2）いま「動作と方向」へのアクセスを聞いています。\n理由：スマホの傾き・揺れを測って、まっすぐ・ぶれずに撮れたかを確かめるためです。「許可」を押してください');
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') S.orientWarn = true;
    }
  } catch (e) { S.orientWarn = true; }
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') await DeviceMotionEvent.requestPermission();
  } catch (e) {}
  window.addEventListener('deviceorientation', onOrient);
  window.addEventListener('devicemotion', onMotion);
  try {
    permNow((NEED_MOTION ? '（2/2）' : '') + 'いま「カメラ」へのアクセスを聞いています。\n理由：背表紙の写真と、本の裏のバーコード（ISBN）を撮るためです。「許可」を押してください');
    await camOpen();
    permNow('');
  } catch (e) {
    permNow('');
    $('startErr').textContent = 'カメラを使えませんでした（' + e.name + '）。下の［標準のカメラで撮る］を使ってください';
    const b = document.createElement('button'); b.textContent = '標準のカメラで撮る'; b.onclick = () => $('fileIn').click(); $('start').appendChild(b);
    return;
  }
  $('start').style.display = 'none'; $('cam').style.display = 'block';
  shelfLabel();
  if (CODE && KID.list.length > 1) $('btnKid').style.display = 'inline-block';
  if (DEBUG) $('debug').style.display = 'block';
  layout(); setTimeout(() => { if (S.beta === null) S.orientWarn = true; }, 1500);
  setFlow(FLOW, true);
  haveLoad();   // 管理者：在庫の一覧
  requestAnimationFrame(loop);
};

// カメラを開く・止める（撮影を終わるの確認の間・終わった後は止める。撮影に戻る・続けて撮影するで開き直す）
async function camOpen() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } } });
  const v = $('video'); v.srcObject = stream; await v.play();
  await camInit(stream.getVideoTracks()[0]);
  if (CAM.zoom && CAM.caps.zoom) setZoom(CAM.zoom);   // 前に選んでいたズームに戻す
  userZoom();
}
function camStop() {
  try { const st = $('video').srcObject; if (st) st.getTracks().forEach(t => t.stop()); $('video').srcObject = null; } catch (e) {}
}
async function camBack() {   // 撮影の画面に戻る（カメラを開き直す）
  S.ending = null; $('endBox').style.display = 'none';
  try { await camOpen(); } catch (e) { toast('カメラを開けませんでした（' + e.name + '）', 4000); }
  $('cam').style.display = 'block'; S.prev = null; updSent();
}
$('btnKid').onclick = () => { $('kidList2').innerHTML = kidHtml(); $('kidPop').style.display = 'flex'; };
$('kidPop').onclick = e => { if (e.target.id === 'kidPop') $('kidPop').style.display = 'none'; };

// ---------------- スマホのカメラの機能（ブラウザから頼めるものだけ。機種が持っていない機能は出さない） ----------------
//   ・オートフォーカス・自動露出・自動ホワイトバランス：「ずっと自動で合わせる」に設定（できる機種）
//   ・タップでピント固定：タップした所にピントを合わせて固定し、黄色い枠を残す（もう一度その枠をタップで解除。できる機種だけ。iPhone は常に自動）
//     ダブルタップ（シャッターを続けて押すときなど）ではピントを動かさない
//   ・ズーム：1×・1.25×・1.5×・2×（実際は 1.9 倍）のボタンとピンチ（2本指。1.9 倍まで）
const CAM = { track: null, caps: {}, zoom: null, poi: false, afLock: null };
async function camInit(tr) {
  CAM.track = tr;
  try { CAM.caps = tr.getCapabilities ? tr.getCapabilities() : {}; } catch (e) { CAM.caps = {}; }
  CAM.poi = CAM.caps.pointsOfInterest !== undefined;
  const c = CAM.caps, adv = {};
  if ((c.focusMode || []).includes('continuous')) adv.focusMode = 'continuous';
  if ((c.exposureMode || []).includes('continuous')) adv.exposureMode = 'continuous';
  if ((c.whiteBalanceMode || []).includes('continuous')) adv.whiteBalanceMode = 'continuous';
  if (Object.keys(adv).length) { try { await tr.applyConstraints({ advanced: [adv] }); } catch (e) {} }
  try { const st = tr.getSettings ? tr.getSettings() : {}; CAM.zoom = st.zoom || (c.zoom ? c.zoom.min : null); } catch (e) {}
  camTools();
}
function camTools() {
  const c = CAM.caps, box = $('camTools'); let h = '';
  if (c.zoom && c.zoom.max > c.zoom.min) {
    const z = CONFIG.ZOOMS.filter(x => x.v >= c.zoom.min && x.v <= c.zoom.max);
    if (z.length > 1) h += z.map(x => `<button data-zoom="${x.v}">${x.label}</button>`).join('');
  }
  box.innerHTML = h;
  box.querySelectorAll('[data-zoom]').forEach(b => b.onclick = () => { CAM.zoomPicked = true; setZoom(+b.dataset.zoom); });
  zoomUi();
}
async function setZoom(z) {

  if (!q || q.cancelled) { toast('取り消せる ISBN がありません', 2000); return; }
  if (!confirm(`直前に読んだ ISBN（${q.isbn}）を取り消しますか？`)) return;
  const it = EV.list.find(x => x.id === q.id); if (it) it.cancelled = true;
  if (EV.last === 'isbn' && q.undo) { EV.last = q.undo.last; EV.isbn = q.undo.isbn; EV.photo = q.undo.photo; }   // 読む前の状態に戻す
  else EV.isbn = null;   // 後に写真を撮っていた：その写真との組は、受け口の記録で取り消しになる
  evSave();
  isbnSend({ how: 'cancel', isbn: q.isbn, id: 'isbn_' + stamp(new Date()) + '_' + Math.random().toString(36).slice(2, 6), target: q.id, at: new Date() });
  isbnMsg(`${q.isbn} を取り消しました`); isbnUi();
};
$('btnIsbnType').onclick = () => {
  beepInit();
  const v = prompt('ISBN を入れてください（10桁か13桁。ハイフンはあってもなくてもよい）');
  if (v === null || !v.trim()) return;
  const isbn = isbn13(v);
  if (!isbn) { toast('ISBN の数字が正しくありません（最後のチェック数字が合いません）', 3000); return; }
  if (EV.list.some(x => x.isbn === isbn && !x.cancelled) && !confirm(`もう読んだ本です（${isbn}）。同じ本がもう1冊ありますか？`)) return;
  isbnAdd(isbn, 'manual');
};

// ---------------- 送る（失敗したら、つながるまで何度でも送り直す） ----------------
const pad = n => String(n).padStart(2, '0');
function fileName(s) {
  const d = s.at, r = Math.random().toString(36).slice(2, 6);
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_${r}.jpg`;
}
async function enqueue(s) {
  s.name = fileName(s);
  s.gas = GAS_URL; s.key = ADMIN ? KEY : '';
  s.meta = { name: s.name, shelf: CODE ? '' : shelf, code: CODE, kid: CODE ? kidId() : '', kid_label: CODE && KID.sel ? KID.sel.label : '', source: s.source, taken_at: s.at.toISOString(), frame: s.frame, sharp: s.sharp, sharp_live: s.sharp_live, light: s.light,
    beta: s.beta, gamma: s.gamma, land: !!s.land, blurred: !!s.blurred, tilt_max: CONFIG.TILT_MAX, ua: navigator.userAgent, original_name: s.name0 || '',
    // 送った人の記録（施設の QR）：端末ID・名前・所属・画面・言語・時間帯
    dev: DEV, user_name: ADMIN ? '' : USER.name, user_org: ADMIN ? '' : USER.org, screen: screen.width + 'x' + screen.height + '@' + (devicePixelRatio || 1),
    lang: navigator.language || '', tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || '') };
  const pr = pairPhoto(s);   // 3分以内に読んだ ISBN と組にする
  s.meta.isbn = pr ? pr.isbn : ''; s.meta.isbn_id = pr ? pr.id : '';
  S.queue.push(s); updSent();
  try { await dbPut(s); s.saved = true; }
  catch (e) { toast('スマホに保存できませんでした。送り終わるまでページを閉じないでください（' + e.message + '）', 4000); }
  pump();
}

// ---------------- 送る前の写真を、ブラウザの保存領域（IndexedDB）に置く ----------------
//   ページを閉じても消えない。次にページを開いたら、続きを自動で送る。送り終わったら消す
const DB_NAME = 'tateoki_shelf_camera', DB_STORE = 'unsent';
let dbP = null;
function db() {
  if (dbP) return dbP;
  dbP = new Promise((ok, ng) => {
    if (!window.indexedDB) { ng(new Error('保存領域を使えません')); return; }
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE, { keyPath: 'name' });
    r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error || new Error('保存領域を開けません'));
  });
  dbP.catch(() => { dbP = null; });
  return dbP;
}
async function dbTx(mode, fn) {
  const d = await db();
  return new Promise((ok, ng) => {
    const tx = d.transaction(DB_STORE, mode), st = tx.objectStore(DB_STORE); let out;
    const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
    tx.oncomplete = () => ok(out); tx.onerror = tx.onabort = () => ng(tx.error || new Error('保存できませんでした'));
  });
}
async function dbPut(s) {
  const buf = s.blob ? await s.blob.arrayBuffer() : null;   // Blob のままだと保存できない古い iPhone があるため、中身の形で置く（ISBN の記録は写真なし）
  return dbTx('readwrite', st => st.put({ name: s.name, gas: s.gas, key: s.key, meta: s.meta, type: s.blob ? (s.blob.type || 'image/jpeg') : '', data: buf, at: Date.now() }));
}
const dbDel = name => dbTx('readwrite', st => st.delete(name)).catch(() => {});
const dbAll = () => dbTx('readonly', st => st.getAll());
const dbClear = () => dbTx('readwrite', st => st.clear()).catch(() => {});
// ページを開いたとき：前回送れなかった写真があれば、カメラを開始しなくてもすぐ送り始める
async function resumeUnsent() {
  let rows = [];
  try { rows = await dbAll(); } catch (e) { return; }
  rows = rows.filter(r => !S.queue.some(q => q.name === r.name)).sort((a, b) => a.at - b.at);
  if (!rows.length) return;
  rows.forEach(r => S.queue.push({ name: r.name, gas: r.gas, key: r.key, meta: r.meta, blob: r.data ? new Blob([r.data], { type: r.type }) : null, saved: true, resumed: true }));
  const el = $('startLeft');
  el.textContent = `前回送れなかった${qLabel()}があります。今から送ります`; el.style.display = 'block';
  updSent(); pump();
}
// まだ送っていないもの：写真○枚・ISBN ○件
function qLabel() {
  const ph = S.queue.filter(q => q.blob).length, ib = S.queue.length - ph;
  return [ph && `写真 ${ph} 枚`, ib && `ISBN ${ib} 件`].filter(Boolean).join('・') || '0 件';
}
function updSent() {
  $('sentN').textContent = `送った写真：${S.sent}枚` + (S.isbnSent ? `\nISBN：${S.isbnSent}件` : '');
  $('sentN').style.whiteSpace = 'pre-line';
  const n = S.queue.length, el = $('sending');
  const ph = S.queue.filter(q => q.blob).length;   // 狭い所に出すので、1行ずつ
  el.textContent = ['送信中', ph && `写真 ${ph}枚`, n - ph && `ISBN ${n - ph}件`].filter(Boolean).join('\n'); el.style.whiteSpace = 'pre-line'; el.style.display = n ? 'block' : 'none';
  $('sbTitle').textContent = `送信中（あと ${qLabel()}）`;
  // 上の送信中の帯は出さない（撮影の邪魔になるため。左下の黄色の「送信中：○枚」で分かる）
  $('sendBanner').style.display = 'none'; document.body.classList.remove('sending');
  if (S.ending === 'wait') endWaitUi();
  const left = $('startLeft');
  if (left.style.display === 'block' && $('start').style.display !== 'none')
    left.textContent = n ? `前回送れなかった分を送っています（あと ${qLabel()}）` : '前回送れなかった分を、すべて送りました';
}

// ---------------- 撮影を終わる ----------------
//   送信中なら［送り終わるまで待つ］［送らずに終わる］を選ぶ。待つ場合は、送り終わったら「閉じて大丈夫です」と出す
$('btnEnd').onclick = () => {
  const n = S.queue.length;
  if (!n) { endDone(); return; }
  camStop(); $('cam').style.display = 'none';
  endShow(`まだ送っていない${qLabel()}があります`, '送らずに終わると、それは送られません',
    [['送り終わるまで待つ', '', () => { S.ending = 'wait'; endWaitUi(); }], ['送らずに終わる', 'sub', () => {
      if (!confirm(`まだ送っていない${qLabel()}は送られません。終わってよいですか？`)) return;
      S.queue.length = 0; dbClear(); endDone(true);
    }], ['撮影に戻る', 'sub', camBack]]);
};
function endShow(msg, sub, btns) {
  $('endMsg').textContent = msg; $('endSub').textContent = sub;
  const box = $('endBtns'); box.innerHTML = '';
  btns.forEach(([label, cls, fn]) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; box.appendChild(b); });
  $('endBox').style.display = 'flex';
}
function endHide() { S.ending = null; $('endBox').style.display = 'none'; }
function endWaitUi() {
  const n = S.queue.length;
  if (!n) { endDone(); return; }
  endShow(`送信中です（あと ${qLabel()}）`, '送り終わるまで、このページを閉じないでください。ほかのアプリに切り替えても大丈夫です（戻ると続きを送ります）',
    [['送らずに終わる', 'sub', () => {
      if (!confirm(`まだ送っていない${qLabel()}は送られません。終わってよいですか？`)) return;
      S.queue.length = 0; dbClear(); endDone(true);
    }], ['撮影に戻る', 'sub', camBack]]);
}
function endDone(dropped) {
  S.ending = 'done';
  camStop();
  $('cam').style.display = 'none'; $('sendBanner').style.display = 'none'; document.body.classList.remove('sending');
  endShow(dropped ? '撮影を終わりました' : '送り終わりました', `送った写真：${S.sent} 枚` + (S.isbnSent ? `\nISBN：${S.isbnSent} 件` : '') + `\nこのページを閉じて大丈夫です`,
    [['続けて撮影する', '', camBack]]);   // 棚はそのまま、すぐ撮影の画面に戻る
  $('endSub').style.whiteSpace = 'pre-line';
}
const b64 = blob => new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ng; r.readAsDataURL(blob); });
async function pump() {
  if (S.busy || !S.queue.length) return;
  S.busy = true;
  const s = S.queue[0];
  try {
    const meta = Object.assign({}, s.meta, { key: s.key || '' });
    const body = JSON.stringify({ meta, image: s.blob ? await b64(s.blob) : '' });   // ISBN の記録は写真なし
    // text/plain にすると、ブラウザの事前確認（CORS の preflight）なしで GAS に送れる
    const res = await fetch(s.gas || GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
    const j = await res.json();
    if (!j.ok) { const er = new Error(j.error || '保存できませんでした'); er.stop = !!j.limit || !!j.blocked; er.blocked = !!j.blocked; throw er; }
    if (S.queue[0] === s) S.queue.shift();
    await dbDel(s.name);   // 送り終わったら保存領域から消す
    if (s.blob) S.sent++; else S.isbnSent = (S.isbnSent || 0) + 1;
  } catch (e) {
    if (e.stop) {   // 1日の上限・止められた端末：送り直さずに止める（写真はスマホに残り、次に開いたときに送る）
      toast(e.blocked ? e.message : e.message + '。撮った写真はスマホに残し、明日以降にこのページを開いたときに送ります', 6000);
      S.busy = false; updSent(); return;
    }
    toast('送れませんでした。つながったら自動で送り直します（' + e.message + '）', 3500);
    S.busy = false; updSent(); setTimeout(pump, 5000); return;
  }
  S.busy = false; updSent(); pump();
}
addEventListener('online', pump);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { pump(); setTimeout(camResume, 300); } });   // ほかのアプリから戻ったら、続きを送る・カメラを開き直す
addEventListener('pageshow', () => setTimeout(camResume, 300));
// 画面を消した・ほかのアプリに切り替えた後に戻ったとき：カメラが止まっていたら開き直す（開けなければ、画面に触れたときにもう一度）
let camResuming = false;
async function camResume() {
  if (document.hidden || camResuming || $('cam').style.display !== 'block' || $('endBox').style.display === 'flex') return;
  const v = $('video'), st = v.srcObject, tr = st && st.getVideoTracks()[0];
  if (tr && tr.readyState === 'live' && !tr.muted && !v.paused && v.videoWidth) return;
  camResuming = true;
  try { camStop(); await camOpen(); S.prev = null; layout(); }
  catch (e) {
    toast('カメラを開き直せませんでした。画面に触れるともう一度開きます', 4000);
    document.addEventListener('click', () => setTimeout(camResume, 50), { once: true });
  } finally { camResuming = false; }
}
resumeUnsent();
addEventListener('beforeunload', e => { if (S.queue.length) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
